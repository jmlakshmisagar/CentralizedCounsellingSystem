server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://prod-db:5432/ccs_db
    username: prod_user
    password: prod_password

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
